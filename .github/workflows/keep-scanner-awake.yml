name: Keep scanner awake during active sessions

on:
  schedule:
    # KRX opens at 09:00 KST; this UTC window covers it and enabled KIS US DAY/PRE/REGULAR sessions through the next KST morning (with DST-safe extra margin).
    - cron: "*/10 0-21 * * 1-5"
    # Warm the Render service shortly before the Korean weekday opens.
    - cron: "30,40,50 23 * * 0-4"
  workflow_dispatch:

permissions: {}

concurrency:
  group: wellscan-keep-awake
  cancel-in-progress: true

jobs:
  keep-awake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Wake Render health endpoint
        env:
          SCANNER_HEALTH_URL: https://well-rebound-scanner.onrender.com/_stcore/health
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 90 --retry 1 "$SCANNER_HEALTH_URL"
